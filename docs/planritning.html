<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Planritning – Magelungen</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 2rem;
      background-color: #f7f7f7;
    }

    h1, h2 {
      text-align: center;
    }

    .image-container {
      position: relative;
      max-width: 100%;
      margin: 0 auto 50px auto;
    }

    .planritning {
      width: 100%;
      height: auto;
      border: 2px solid #ccc;
      border-radius: 8px;
      display: block;
    }

    .info-icon {
      position: absolute;
      width: 48px;
      height: 48px;
      background-color: #007bff;
      color: white;
      font-weight: bold;
      border-radius: 50%;
      text-align: center;
      line-height: 48px;
      cursor: pointer;
      font-size: 24px;
      z-index: 5;
    }

    .tooltip {
      position: absolute;
      background-color: white;
      color: #333;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      width: 220px;
      display: none;
      z-index: 10;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .menu-button {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 999;
      font-size: 60px;
      background: none;
      border: none;
      cursor: pointer;
    }

    #menu {
      display: none;
      position: fixed;
      top: 20px;
      right: 20px;
      width: 260px;
      background: white;
      border: 2px solid #ccc;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      padding: 20px;
      z-index: 1001;
    }

    #menu.active {
      display: block;
    }

    #menu a {
      display: block;
      margin: 16px 0;
      text-decoration: none;
      color: #333;
      font-size: 1.2rem;
      padding: 10px;
      border-radius: 6px;
    }

    #menu a:hover {
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>

  <!-- Menyknapp -->
  <button class="menu-button" id="menuButton">☰</button>

  <nav id="menu" aria-hidden="true">
    <a href="index.html">🏠 Hem</a>
    <a href="hur-det-ser-ut.html">📷 Hur det ser ut</a>
    <a href="vagen-hit.html">🗺️ Vägen hit</a>
    <a href="sensorisk-guide.html">👃 Sensorisk guide</a>
    <a href="aktivitetsled.html">📝 Aktivitetsled</a>
    <a href="bildstod.html">🧩 Bildstöd</a>
    <a href="planritning.html">📐 Planritning</a>
    <a href="om-oss.html">ℹ️ Om oss</a>
  </nav>

  <h1>Planritning – Magelungen</h1>

  <div class="image-container">
    <img src="https://raw.githubusercontent.com/tryggtbessoook/Tryggtbesok/main/docs/Magelungen/1.png" alt="Planritning med zoner" class="planritning">

    <!-- Frågetecken (info-ikoner) placerade enligt instruktion -->
    <!-- Entré – ned 1 dm (10%) -->
    <div class="info-icon" style="top: 75%; left: 10%;">?</div>

    <!-- Lounge – upp några cm och mer i mitten -->
    <div class="info-icon" style="top: 37%; left: 47%;">?</div>

    <!-- Lugna avdelningen – upp 2 cm (5%), höger 1 dm (10%) -->
    <div class="info-icon" style="top: 42%; left: 81%;">?</div>

    <!-- Matbord – upp 1 cm (2.5%), vänster 1 dm (10%) -->
    <div class="info-icon" style="top: 49.5%; left: 36%;">?</div>

    <!-- Föreläsning – upp 2 dm (20%), höger 1 dm (10%) -->
    <div class="info-icon" style="top: 18%; left: 78%;">?</div>

    <!-- (Du kan lägga till fler ikoner här vid behov) -->
  </div>

  <h2>Sensorisk översikt</h2>

  <div class="image-container">
    <img src="https://raw.githubusercontent.com/tryggtbessoook/Tryggtbesok/main/docs/Magelungen/2.png" alt="Sensorisk plan" class="planritning">
  </div>

  <script>
    const menu = document.getElementById("menu");
    const menuButton = document.getElementById("menuButton");

    function toggleMenu() {
      menu.classList.toggle("active");
    }

    menuButton.addEventListener("click", function (e) {
      e.stopPropagation();
      toggleMenu();
    });

    document.addEventListener("click", function (e) {
      if (!menu.contains(e.target) && !menuButton.contains(e.target)) {
        menu.classList.remove("active");
      }
    });

    // (Valfritt: klicka på frågetecken för tooltip – inte aktiverat ännu)
  </script>

</body>
</html>
