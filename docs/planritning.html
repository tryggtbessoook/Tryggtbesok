<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Planritning – Magelungen</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 2rem;
      background-color: #f7f7f7;
    }

    h1, h2 {
      text-align: center;
    }

    .image-container {
      position: relative;
      max-width: 100%;
      margin: 0 auto 50px auto;
    }

    .planritning {
      width: 100%;
      height: auto;
      border: 2px solid #ccc;
      border-radius: 8px;
      display: block;
    }

    .info-icon {
      position: absolute;
      width: 24px;
      height: 24px;
      background-color: #007bff;
      color: white;
      font-weight: bold;
      border-radius: 50%;
      text-align: center;
      line-height: 24px;
      cursor: pointer;
      font-size: 16px;
      z-index: 5;
    }

    .tooltip {
      position: absolute;
      background-color: white;
      color: #333;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      width: 220px;
      display: none;
      z-index: 10;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>

  <h1>Planritning – Magelungen</h1>

  <div class="image-container">
    <!-- Planritning -->
    <img src="https://raw.githubusercontent.com/tryggtbessoook/Tryggtbesok/main/docs/Magelungen/1.png" alt="Planritning med zoner" class="planritning">

    <!-- Entré -->
    <div class="info-icon" style="top: 12%; left: 9%;">?</div>
    <div class="tooltip" style="top: 16%; left: 9%;">
      <strong>Entré:</strong><br>Här kommer du in. Ljud, ljus och många intryck kan förekomma här.
    </div>

    <!-- Lounge -->
    <div class="info-icon" style="top: 29%; left: 36%;">?</div>
    <div class="tooltip" style="top: 33%; left: 36%;">
      <strong>Lounge:</strong><br>Plats för att vänta, varva ner och anpassa sig.
    </div>

    <!-- Kök -->
    <div class="info-icon" style="top: 50%; left: 63%;">?</div>
    <div class="tooltip" style="top: 54%; left: 63%;">
      <strong>Kök:</strong><br>Här är köket. Doft av mat och sorl kan förekomma.
    </div>

    <!-- Klassrum -->
    <div class="info-icon" style="top: 69%; left: 39%;">?</div>
    <div class="tooltip" style="top: 73%; left: 39%;">
      <strong>Klassrum:</strong><br>Lugn zon för koncentration och instruktioner.
    </div>
  </div>

  <h2>Sensorisk översikt</h2>

  <div class="image-container">
    <img src="https://raw.githubusercontent.com/tryggtbessoook/Tryggtbesok/main/docs/Magelungen/2.png" alt="Sensorisk plan" class="planritning">
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const tooltips = document.querySelectorAll(".tooltip");
      const icons = document.querySelectorAll(".info-icon");

      icons.forEach((icon, index) => {
        icon.addEventListener("click", function (e) {
          e.stopPropagation();
          tooltips.forEach((tip, i) => {
            tip.style.display = (i === index) ? "block" : "none";
          });
        });
      });

      document.addEventListener("click", function () {
        tooltips.forEach(tip => tip.style.display = "none");
      });
    });
  </script>

</body>
</html>
