<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vägen hit</title>
  <style>
    body {
      font-family: sans-serif;
      background: #fff;
      margin: 0;
      padding: 0;
    }

    .menu-button {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1002;
      font-size: 28px;
      background: none;
      border: none;
      cursor: pointer;
    }

    #menu {
      display: none;
      position: fixed;
      top: 60px;
      right: 20px;
      background-color: white;
      border: 1px solid #ccc;
      padding: 12px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      z-index: 1001;
    }

    #menu a {
      text-decoration: none;
      color: #000;
      display: block;
      margin: 8px 0;
      font-size: 18px;
    }

    #menu a:hover {
      text-decoration: underline;
    }

    main {
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 20px;
    }

    iframe {
      max-width: 100%;
      height: auto;
      border: none;
    }
  </style>
  <script>
    function toggleMenu() {
      const menu = document.getElementById('menu');
      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    }

    document.addEventListener('click', function(event) {
      const menu = document.getElementById('menu');
      const button = document.querySelector('.menu-button');
      if (!menu.contains(event.target) && !button.contains(event.target)) {
        menu.style.display = 'none';
      }
    });
  </script>
</head>

<body>
  <!-- Menyknapp -->
  <button class="menu-button" onclick="toggleMenu()">☰</button>

  <!-- Meny -->
  <nav id="menu">
    <a href="index.html">🏠 Hem</a>
    <a href="hur-det-ser-ut.html">📷 Hur det ser ut</a>
    <a href="vagen-hit.html">🗺️ Vägen hit</a>
    <a href="sensorisk-guide.html">👃 Sensorisk guide</a>
    <a href="aktivitetsled.html">📝 Aktivitetsled</a>
    <a href="bildstod.html">🧩 Bildstöd</a>
    <a href="om-oss.html">ℹ️ Om oss</a>
  </nav>

  <!-- Innehåll -->
  <main>
    <h1>Vägen hit</h1>
    <iframe
      width="360"
      height="640"
      src="https://www.youtube.com/embed/88nWu4DPHas"
      title="Vägen hit"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  </main>
</body>
</html>
